<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS SYSTEM | THE KINGDOM 🐲</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background: #000 url('https://w0.peakpx.com/wallpaper/188/875/HD-wallpaper-black-stone-wall-texture-black-stone-background-stone-textures-wall-black-backgrounds.jpg');
            background-size: cover;
            color: white; font-family: 'Cairo', sans-serif;
        }

        /* الشريط العلوي */
        header {
            background: rgba(0, 0, 0, 0.85);
            border-bottom: 2px solid #8b0000;
            padding: 10px 0; text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .header-title { font-size: 24px; font-weight: 900; color: #fff; }
        .header-title span { color: #ff3131; }

        /* التنقل (Navbar) */
        nav {
            display: flex; justify-content: center; gap: 20px;
            background: rgba(20, 0, 0, 0.9); padding: 8px;
            border-bottom: 1px solid #440000;
        }
        nav a { color: #aaa; text-decoration: none; font-size: 14px; font-weight: bold; transition: 0.3s; }
        nav a:hover, nav a.active { color: #ff3131; }

        .container {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 20px; padding: 30px 10px; max-width: 1200px; margin: auto;
        }

        /* منطقة الإدخال الرئيسية */
        .main-attack-box {
            background: rgba(15, 15, 15, 0.9);
            border: 2px solid #330000; border-radius: 15px;
            padding: 25px; width: 100%; max-width: 600px;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.2);
            position: relative; overflow: hidden;
        }
        .main-attack-box::before {
            content: ""; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: url('https://pngimg.com/uploads/dragon/dragon_PNG84.png') no-repeat center;
            background-size: 300px; opacity: 0.1; z-index: 0; pointer-events: none;
        }

        .input-row { display: flex; gap: 15px; margin-bottom: 20px; z-index: 1; position: relative; }
        .field { flex: 1; text-align: right; }
        label { display: block; font-size: 13px; color: #ff3131; margin-bottom: 8px; font-weight: bold; }
        
        input, textarea {
            width: 100%; background: #0a0a0a; border: 1px solid #550000;
            border-radius: 8px; padding: 12px; color: #fff; font-family: 'Cairo';
            box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #ff3131; box-shadow: 0 0 10px rgba(255, 49, 49, 0.3); }

        .status-area {
            background: rgba(0, 0, 0, 0.5); padding: 15px;
            border-radius: 10px; border-right: 4px solid #ff3131;
            margin: 20px 0; font-size: 14px; line-height: 1.8;
        }

        .btn-send {
            background: #600000; color: white; border: none;
            padding: 15px 40px; border-radius: 8px; font-weight: 900;
            font-size: 18px; cursor: pointer; transition: 0.3s; width: 100%;
        }
        .btn-send:hover { background: #ff3131; transform: scale(1.02); }

        /* الـ Leaderboard (قائمة الشرف) */
        .leaderboard {
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid #440000; border-radius: 15px;
            padding: 20px; width: 100%; max-width: 300px;
            text-align: center;
        }
        .leaderboard h3 { color: #d4af37; margin-top: 0; border-bottom: 1px solid #330000; padding-bottom: 10px; }
        .rank-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; border-bottom: 1px solid #220000;
        }
        .rank-name { font-weight: bold; color: #fff; }
        .rank-score { color: #d4af37; }

        .footer-quote {
            text-align: center; padding: 40px; color: #666;
            font-size: 18px; font-weight: bold; letter-spacing: 2px;
        }
        .footer-quote span { color: #ff3131; }

        @media (max-width: 768px) { .input-row { flex-direction: column; } }
    </style>
</head>
<body>

<header>
    <div class="header-title">نظام <span>أوس</span> | AWS SYSTEM</div>
    <div style="font-size: 10px; color: #d4af37; letter-spacing: 5px;">FIRE AND BLOOD</div>
</header>

<nav>
    <a href="#" class="active">الرئيسية 🐲</a>
    <a href="#">هجوم السلسلة</a>
    <a href="#">قائمة الشرف</a>
    <a href="#">دعم النجوم</a>
</nav>

<div class="container">
    <!-- الصندوق الرئيسي -->
    <div class="main-attack-box">
        <div class="input-row">
            <div class="field">
                <label>الموضوع</label>
                <input type="text" id="sub" placeholder="اكتب الموضوع هنا..">
            </div>
            <div class="field">
                <label>الجيميل (الدعم)</label>
                <input type="text" id="target" value="abuse@telegram.org" readonly>
            </div>
        </div>

        <div class="field">
            <label>الكليشة (التنبيه)</label>
            <textarea id="msg" rows="6" placeholder="الصق الكليشة هنا.."></textarea>
        </div>

        <div class="status-area">
            <div>عدد الإرسال: <span id="countDisplay" style="color:#d4af37">0</span></div>
            <div>الحالة التشغيلية: <span style="color:#00ff00">🔥 الإرسال مفتوح</span></div>
            <div>قوة التارغاريان: <span style="color:#31a3ff">🛡️ مفعلة</span></div>
        </div>

        <button class="btn-send" onclick="send()">ابدء الإرسال</button>
    </div>

    <!-- قائمة المتبرعين -->
    <div class="leaderboard">
        <div style="background:#440000; padding:5px; border-radius:5px; margin-bottom:15px; font-size:12px;">Leaderboard</div>
        <h3>تنانين التارغاريان</h3>
        <div class="rank-item">
            <span class="rank-name">👑 F16 </span>
            <span class="rank-score">100 ⭐</span>
        </div>
        <div class="rank-item">
            <span class="rank-name">🐲 حمودي</span>
            <span class="rank-score">70 ⭐</span>
        </div>
        <div class="rank-item">
            <span class="rank-name">👤 المحبين</span>
            <span class="rank-score">20 ⭐</span>
        </div>
        <img src="https://i.pinimg.com/originals/84/f1/44/84f1440268f7601f786d3e8523c914e6.png" style="width:150px; margin-top:20px; opacity:0.6">
    </div>
</div>

<div class="footer-quote">
    قوة <span>التارغاريان</span> بين يديك..
</div>

<script>
    window.onload = () => {
        document.getElementById("countDisplay").innerText = localStorage.getItem("strike_count") || 0;
        const savedSub = localStorage.getItem("sub");
        const savedMsg = localStorage.getItem("msg");
        if(savedSub) document.getElementById("sub").value = savedSub;
        if(savedMsg) document.getElementById("msg").value = savedMsg;
    };

    function send() {
        let strikes = parseInt(localStorage.getItem("strike_count") || 0) + 1;
        localStorage.setItem("strike_count", strikes);
        document.getElementById("countDisplay").innerText = strikes;
        
        const sub = document.getElementById("sub").value;
        const msg = document.getElementById("msg").value;
        localStorage.setItem("sub", sub);
        localStorage.setItem("msg", msg);

        const targetMail = "abuse@telegram.org";
        const mailtoLink = "mailto:" + targetMail + "?to=" + targetMail + "&subject=" + encodeURIComponent(sub) + "&body=" + encodeURIComponent(msg);

        // محاولة الفتح بطريقة تليجرام
        const newWin = window.open(mailtoLink, '_blank');
        if(!newWin || newWin.closed) {
            window.location.href = mailtoLink;
        }
    }
</script>

</body>
</html>
