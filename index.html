<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAHM ING PRO | نظام الشد المطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-cyan: #00f2ff; --ing-gold: #ffcc00; --dark-space: #0a0b10; }
        body { 
            background: var(--dark-space); color: white; font-family: 'Cairo', sans-serif;
            margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
            background-image: radial-gradient(circle at center, #1a1f35 0%, #0a0b10 100%);
        }
        .container { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px);
            padding: 35px; border-radius: 25px; width: 90%; max-width: 450px;
            border: 1px solid rgba(0, 242, 255, 0.2); box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
        }
        .container::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, var(--main-cyan), transparent 30%);
            animation: rotate 6s linear infinite; z-index: -1; opacity: 0.1;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        
        h1 { font-size: 38px; margin: 0; font-weight: 900; letter-spacing: -1px; }
        h1 span { color: var(--ing-gold); text-shadow: 0 0 15px var(--ing-gold); }
        .neon-text { color: var(--main-cyan); text-shadow: 0 0 10px var(--main-cyan); font-size: 10px; letter-spacing: 5px; margin-bottom: 25px; }

        .input-box { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #8899a6; font-weight: bold; }
        input, textarea { 
            width: 100%; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid #2f3336;
            border-radius: 12px; color: white; outline: none; transition: 0.3s; box-sizing: border-box;
        }
        input:focus, textarea:focus { border-color: var(--main-cyan); box-shadow: 0 0 10px rgba(0, 242, 255, 0.2); }

        .btn-strike { 
            background: linear-gradient(90deg, #00d2ff, #3a7bd5); color: white;
            padding: 18px; border: none; border-radius: 15px; cursor: pointer;
            width: 100%; font-weight: 900; font-size: 18px; margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4); transition: 0.3s;
        }
        .btn-strike:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 210, 255, 0.6); }

        .visitor-counter { margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <div style="text-align: center;">
            <h1>SHAHM <span>ING</span></h1>
            <div class="neon-text">SYSTEM V2 PRO</div>
        </div>

        <div class="input-box">
            <label>بريد الدعم (Target Support)</label>
            <input type="email" id="target_email" placeholder="support@telegram.org" oninput="saveData()">
        </div>

        <div class="input-box">
            <label>موضوع الرسالة</label>
            <input type="text" id="subject" placeholder="Technical Report" oninput="saveData()">
        </div>

        <div class="input-box">
            <label>الكليشة الاحترافية</label>
            <textarea id="klisha" rows="5" placeholder="ضع نص البلاغ هنا..." oninput="saveData()"></textarea>
        </div>

        <button class="btn-strike" onclick="launchGmail()">إرسال الضربة الصاعقة ⚡</button>

        <div class="visitor-counter">
            <p>عدد الزوار الإجمالي لجهازك:</p>
            <img src="https://hitwebcounter.com/counter/counter.php?page=shahming_v2&style=0006&nbdigits=5&type=page&initCount=0" title="Free Counter" Alt="web counter" border="0" />
        </div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem("s_email")) document.getElementById("target_email").value = localStorage.getItem("s_email");
            if (localStorage.getItem("s_sub")) document.getElementById("subject").value = localStorage.getItem("s_sub");
            if (localStorage.getItem("s_kli")) document.getElementById("klisha").value = localStorage.getItem("s_kli");
        };

        function saveData() {
            localStorage.setItem("s_email", document.getElementById("target_email").value);
            localStorage.setItem("s_sub", document.getElementById("subject").value);
            localStorage.setItem("s_kli", document.getElementById("klisha").value);
        }

        function launchGmail() {
            const email = document.getElementById('target_email').value || "support@telegram.org";
            const sub = document.getElementById('subject').value || "Support";
            const body = document.getElementById('klisha').value;

            const mailto = `mailto:${email}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;
            window.location.href = mailto;
        }
    </script>
</body>
</html>
