<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAHM ING PRO | @ShahmZone</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --gold: #ffcc00; --bg: #05060a; --red: #ff4b2b; }
        body { 
            background: var(--bg); color: white; font-family: 'Cairo', sans-serif; 
            margin: 0; display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; padding: 20px 0; overflow-x: hidden;
        }
        /* كود المطر النيوني */
        #rainCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        .main-card { 
            background: rgba(10, 12, 18, 0.95); padding: 25px; border-radius: 25px; 
            width: 90%; max-width: 420px; border: 1px solid var(--neon); 
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.15); text-align: center; 
            backdrop-filter: blur(10px); position: relative; z-index: 1;
        }
        h1 { font-size: 32px; font-weight: 900; margin: 0; color: white; }
        h1 span { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        .sub-title { color: var(--neon); font-size: 9px; letter-spacing: 3px; margin-bottom: 20px; opacity: 0.8; }
        
        .strike-display { background: rgba(0, 242, 255, 0.05); border: 1px dashed var(--neon); padding: 12px; border-radius: 15px; margin-bottom: 15px; }
        .strike-count { font-size: 26px; font-weight: 900; color: var(--gold); }
        .btn-reset { background: transparent; color: var(--red); border: 1px solid var(--red); padding: 2px 8px; border-radius: 8px; cursor: pointer; font-size: 10px; margin-top: 5px; }

        .field { text-align: right; margin-bottom: 12px; position: relative; }
        label { display: block; font-size: 11px; color: #8899a6; margin-bottom: 4px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; background: #111821; border: 1px solid #2f3336; border-radius: 10px; color: white; outline: none; box-sizing: border-box; font-family: 'Cairo'; font-size: 14px; }
        input:focus, textarea:focus { border-color: var(--neon); }

        .quick-btn { background: #1a242f; color: var(--neon); border: 1px solid var(--neon); padding: 4px 10px; border-radius: 5px; font-size: 10px; cursor: pointer; margin-top: 5px; }
        .copy-btn { position: absolute; left: 8px; top: 30px; background: var(--neon); color: black; border: none; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; cursor: pointer; z-index: 2; }

        .btn-go { background: linear-gradient(45deg, #00d2ff, #3a7bd5); color: white; padding: 15px; border: none; border-radius: 15px; cursor: pointer; width: 100%; font-weight: 900; font-size: 18px; margin-top: 10px; box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3); }
        .btn-dev { background: transparent; color: white; border: 1px solid white; padding: 8px; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 10px; font-size: 12px; font-weight: bold; text-decoration: none; display: inline-block; box-sizing: border-box; }
        
        .rights { margin-top: 20px; font-size: 11px; color: #55acee; }
    </style>
</head>
<body>

    <canvas id="rainCanvas"></canvas>

    <div class="main-card">
        <h1>SHAHM <span>ING</span></h1>
        <div class="sub-title">PREMIUM STRIKE SYSTEM</div>

        <div class="strike-display">
            <div style="font-size: 10px; color: #8899a6;">إجمالي الضربات الحالية</div>
            <div class="strike-count" id="countDisplay">0</div>
            <button class="btn-reset" onclick="resetCounter()">تصفير 🔄</button>
        </div>

        <div class="field">
            <label>بريد الدعم</label>
            <input type="email" id="target" placeholder="support@telegram.org">
            <button class="quick-btn" onclick="setAbuse()">استخدام بريد الإساءة ⚠️</button>
        </div>

        <div class="field">
            <label>الموضوع</label>
            <input type="text" id="sub" placeholder="Report ID: 991">
        </div>

        <div class="field">
            <label>الكليشة</label>
            <button class="copy-btn" onclick="copyKlisha()">نسخ 📋</button>
            <textarea id="msg" rows="3" placeholder="ضع كليشة الهجوم هنا..."></textarea>
        </div>

        <div class="field">
            <label>ملاحظات الأهداف (يوزرات الضحايا)</label>
            <textarea id="notes" rows="2" placeholder="اكتب اليوزرات هنا لحفظها..." style="border-color: #444;"></textarea>
        </div>

        <button class="btn-go" onclick="send()">إطلاق الهجوم ⚡</button>
        
        <a href="https://t.me/ShahmZone" class="btn-dev">تواصل مع المطور 👨‍💻</a>

        <div class="rights">
            حقوق النظام محفوظة لـ <span style="color: var(--gold);">SHAHM ZONE</span>
        </div>
    </div>

    <script>
        // نظام المطر التفاعلي
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, raindrops = [];
        let tilt = 0;

        function initRain() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            raindrops = [];
            for (let i = 0; i < 100; i++) {
                raindrops.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    len: Math.random() * 20 + 10,
                    speed: Math.random() * 5 + 2
                });
            }
        }

        function drawRain() {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = '#00f2ff';
            ctx.lineWidth = 1;
            ctx.lineCap = 'round';

            raindrops.forEach(p => {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p.x + tilt, p.y + p.len);
                ctx.stroke();

                p.y += p.speed;
                p.x += tilt * 0.1;

                if (p.y > height) {
                    p.y = -p.len;
                    p.x = Math.random() * width;
                }
            });
            requestAnimationFrame(drawRain);
        }

        // التفاعل مع حركة الموبايل
        window.addEventListener('deviceorientation', (e) => {
            tilt = e.gamma * 0.5; // تمييل المطر بناءً على زاوية الموبايل
        });

        window.addEventListener('resize', initRain);

        // نظام الحفظ والوظائف
        const ids = ['target', 'sub', 'msg', 'notes'];
        
        window.onload = () => {
            initRain();
            drawRain();
            ids.forEach(id => document.getElementById(id).value = localStorage.getItem(id) || "");
            document.getElementById("countDisplay").innerText = localStorage.getItem("strike_count") || 0;
            ids.forEach(id => {
                document.getElementById(id).addEventListener('input', () => {
                    localStorage.setItem(id, document.getElementById(id).value);
                });
            });
        };

        function setAbuse() {
            document.getElementById('target').value = 'abuse@telegram.org';
            localStorage.setItem('target', 'abuse@telegram.org');
        }

        function copyKlisha() {
            const txt = document.getElementById('msg');
            txt.select();
            document.execCommand('copy');
            alert('تم نسخ الكليشة بنجاح!');
        }

        function resetCounter() {
            if (confirm("تصفير العداد؟")) {
                localStorage.setItem("strike_count", 0);
                document.getElementById("countDisplay").innerText = 0;
            }
        }

        function send() {
            const t = document.getElementById("target").value || "support@telegram.org";
            const s = document.getElementById("sub").value || "Support";
            const m = document.getElementById("msg").value;
            let strikes = parseInt(localStorage.getItem("strike_count") || 0);
            strikes++;
            localStorage.setItem("strike_count", strikes);
            document.getElementById("countDisplay").innerText = strikes;
            window.location.href = `mailto:${t}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(m)}`;
        }
    </script>
</body>
</html>
