<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AWS F16 | THE FINAL DRAGON 🐲</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --fire: #ff3131; --gold: #d4af37; --bg: #0a0a0a; 
            --card-bg: rgba(15, 15, 15, 0.98); --dragon-glow: rgba(255, 49, 49, 0.3);
        }
        body { 
            background: var(--bg); color: white; font-family: 'Cairo', sans-serif; 
            margin: 0; min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at center, #1a0505 0%, #0a0a0a 100%);
            user-select: none; -webkit-user-select: none;
        }

        /* شريط الأخبار */
        .news-ticker { background: linear-gradient(90deg, transparent, rgba(255, 49, 49, 0.2), transparent); border-bottom: 1px solid var(--fire); white-space: nowrap; overflow: hidden; padding: 8px 0; position: relative; z-index: 101; }
        .news-content { display: inline-block; padding-left: 100%; animation: ticker 25s linear infinite; color: var(--gold); font-size: 13px; font-weight: bold; }
        @keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

        /* عداد المتصلين */
        .online-count { position: fixed; top: 60px; left: 15px; background: rgba(0, 0, 0, 0.8); border: 1px solid var(--fire); padding: 5px 12px; border-radius: 20px; font-size: 11px; z-index: 100; box-shadow: 0 0 10px var(--dragon-glow); color: #fff; }
        .online-dot { height: 7px; width: 7px; background-color: #00ff00; border-radius: 50%; display: inline-block; margin-left: 5px; box-shadow: 0 0 5px #00ff00; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        #rainCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        header { background: rgba(0, 0, 0, 0.9); border-bottom: 2px solid #4a0000; padding: 15px 0; text-align: center; }
        header h1 { font-size: 24px; margin: 0; color: white; }
        header h1 span { color: var(--fire); text-shadow: 0 0 10px var(--fire); }
        
        nav { display: flex; justify-content: center; gap: 8px; background: rgba(30, 0, 0, 0.8); padding: 10px; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        nav button { background: rgba(255,255,255,0.05); border: none; color: #aaa; cursor: pointer; font-size: 12px; font-weight: bold; font-family: 'Cairo'; padding: 8px 12px; border-radius: 8px; transition: 0.3s; }
        nav button.active { color: var(--fire); background: rgba(255,0,0,0.1); border: 1px solid var(--fire); }

        .container { max-width: 480px; margin: 20px auto; padding: 0 15px; box-sizing: border-box; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .main-card { background: var(--card-bg); padding: 25px; border-radius: 20px; border: 2px solid #2a0000; box-shadow: 0 0 40px var(--dragon-glow); text-align: center; border-top: 4px solid var(--fire); }
        
        .counters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .strike-display { background: rgba(255, 0, 0, 0.08); border: 1px solid #441111; padding: 10px; border-radius: 15px; }
        .strike-count { font-size: 28px; font-weight: 900; color: var(--gold); }
        .rank-tag { font-size: 10px; color: var(--fire); font-weight: bold; margin-top: 5px; display: block; }

        .field { text-align: right; margin-bottom: 18px; position: relative; }
        label { display: block; font-size: 13px; color: #b0b0b0; margin-bottom: 8px; font-weight: bold; }
        input, textarea { width: 100%; padding: 15px; background: #1a0f0f; border: 1px solid #3d1a1a; border-radius: 12px; color: white; outline: none; box-sizing: border-box; font-size: 15px; font-family: 'Cairo'; }
        .paste-btn { position: absolute; left: 10px; top: 38px; background: var(--gold); color: black; border: none; padding: 5px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; z-index: 5; }
        .btn-go { background: linear-gradient(45deg, #8b0000, #ff3131); color: white; padding: 18px; border: none; border-radius: 15px; cursor: pointer; width: 100%; font-weight: 900; font-size: 22px; box-shadow: 0 8px 20px rgba(255, 0, 0, 0.4); }

        .attack-log { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; margin-bottom: 10px; border-right: 3px solid var(--fire); text-align: right; }
        .log-user { color: var(--gold); font-weight: bold; font-size: 14px; display: block; }

        #toast { position: fixed; top: 20px; right: 20px; background: rgba(255, 49, 49, 0.9); color: white; padding: 15px 25px; border-radius: 10px; font-weight: bold; z-index: 1000; display: none; box-shadow: 0 0 15px var(--fire); animation: slideIn 0.5s ease; }
        #statusMsg { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--fire); color: white; padding: 12px 25px; border-radius: 50px; font-weight: bold; display: none; z-index: 9999; box-shadow: 0 0 20px var(--fire); text-align: center; font-size: 13px; }
        .btn-dev { background: rgba(212, 175, 55, 0.05); color: var(--gold); border: 1px solid var(--gold); padding: 12px; border-radius: 12px; width: 100%; margin-top: 20px; display: block; text-decoration: none; font-weight: bold; box-sizing: border-box; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="toast">🔔 هجوم جديد!</div>
    <div class="news-ticker"><div class="news-content" id="tickerText">جارِ تحميل موازين الحكمة...</div></div>
    <div class="online-count">المقاتلين الآن: <span id="onlineUsers">--</span> <span class="online-dot"></span></div>
    <div id="statusMsg">🔥 دراكاريس! جاري الإرسال</div>
    <canvas id="rainCanvas"></canvas>

    <header><h1>AWS <span>𝐅𝟏𝟔<span></h1><div style="font-size: 9px; color: var(--gold); letter-spacing: 3px;">DRACARYS PROTOCOL 🐲</div></header>

    <nav id="navbar">
        <button onclick="showPage('home')" id="btn-home" class="active">الرئيسية</button>
        <button onclick="showPage('attacks')" id="btn-attacks">سجل العمليات</button>
        <button onclick="showPage('honor')" id="btn-honor">قائمة الشرف</button>
        <button onclick="window.location.href='https://t.me/Tydj7'">دعم النجوم</button>
    <div class="container">
        <div id="home" class="page active">
            <div class="main-card">
                <div class="counters-grid">
                    <div class="strike-display">
                        <div style="font-size: 9px; color: #a0a0a0;">ضرباتي</div>
                        <div class="strike-count" id="countDisplay">0</div>
                        <span class="rank-tag" id="userRank">جندي 🛡️</span>
                    </div>
                    <div class="strike-display" style="border-color: var(--gold);">
                        <div style="font-size: 9px; color: #a0a0a0;">الضربات العالمية</div>
                        <div class="strike-count" id="globalCount" style="color: var(--fire);">0</div>
                        <span class="rank-tag" style="color: var(--gold);"> القوة الكليه للجميع 🐉</span>
                    </div>
                </div>
                <div class="field"><label>هدف الهجوم</label><input type="text" id="target" value="abuse@telegram.org" readonly style="color: var(--gold); text-align: center; font-weight: bold;"></div>
                <div class="field"><label>الموضوع</label><input type="text" id="sub" placeholder="اكتب الموضوع هنا.."></div>
                <div class="field">
                    <label>الكليشة</label>
                    <button class="paste-btn" onclick="pasteKlisha()">لصق 📋</button>
                    <textarea id="msg" rows="5" placeholder="الصق كليشتك هنا..."></textarea>
                </div>
                <button class="btn-go" onclick="send()">دراكاريس 🔥</button>
                <a href="https://t.me/Tydj7" class="btn-dev">تواصل مع المطور أوس 🐲</a>
            </div>
        </div>

        <div id="attacks" class="page">
            <div class="main-card"><h3 style="color:var(--fire); margin-top:0;">رادار الهجمات المباشر 📡</h3><div id="attackLogs"></div></div>
        </div>

        <div id="honor" class="page">
            <div class="main-card">
                <h3 style="color:var(--gold); margin-top:0;"> أساطير الابلاغات 🎖️</h3>
                <div id="honorGrid">
                    <p style="color: #666; font-size: 12px;">جاري استدعاء الأساطير...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        // إعدادات قاعدة البيانات
        const firebaseConfig = {
            apiKey: "AIzaSyCuYXrQzb3lttaLMSq89aeDKu2qkNC5d_Y",
            authDomain: "aws-systeming.firebaseapp.com",
            databaseURL: "https://aws-systeming-default-rtdb.firebaseio.com/",
            projectId: "aws-systeming",
            storageBucket: "aws-systeming.firebasestorage.app",
            messagingSenderId: "174474636860",
            appId: "1:174474636860:web:daf6526a9e5c3f0b53dd39"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // نظام الرتب
        function getRank(count) {
            if (count >= 100) return "ملك الابلاغات 👑";
            if (count >= 50) return "محارب أسطوري 🔥";
            if (count >= 20) return "قائد الحرس ⚔️";
            if (count >= 10) return "مقاتل  🛡️";
            return "جندي مستجد 🛡️";
        }

        // تحديث البيانات العالمية والمباشرة
        database.ref('global_strikes').on('value', (snap) => { document.getElementById('globalCount').innerText = snap.val() || 0; });

        database.ref('attacks').limitToLast(1).on('child_added', (snapshot) => {
            const data = snapshot.val();
            const toast = document.getElementById('toast');
            toast.innerText = `🔥 هجوم من: ${data.user}`;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        });

        database.ref('attacks').limitToLast(15).on('value', (snapshot) => {
            const container = document.getElementById('attackLogs');
            if (!container) return;
            container.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                container.innerHTML = `<div class="attack-log"><span class="log-user">👤 ${data.user}</span><span class="log-target"> ⚔️ يشن هجوماً ساحقاً [${data.time}]</span></div>` + container.innerHTML;
            });
        });

        // دالة الإرسال (MAILTO) المتوافقة مع تليجرام
        function send() {
            let user = localStorage.getItem("dragon_name");
            if (!user) {
                user = prompt("أدخل اسمك القتالي:");
                if (!user) user = "تنين مجهول";
                localStorage.setItem("dragon_name", user);
            }

            let strikes = parseInt(localStorage.getItem("strike_count") || 0) + 1;
            localStorage.setItem("strike_count", strikes);
            document.getElementById("countDisplay").innerText = strikes;
            document.getElementById("userRank").innerText = getRank(strikes);

            const time = new Date().toLocaleTimeString('ar-IQ');
            database.ref('attacks').push({ user: user, time: time });
            database.ref('global_strikes').transaction(current => (current || 0) + 1);

            const targetMail = "abuse@telegram.org";
            const subjectText = document.getElementById("sub").value.trim();
            const bodyText = document.getElementById("msg").value;
            showStatus("🔥 دراكاريس! جاري الإرسال..");
            
            // الرابط الذي يضمن تعبئة الحقول في متصفح تليجرام
            const mailtoLink = "mailto:" + targetMail + "?to=" + targetMail + "&subject=" + encodeURIComponent(subjectText) + "&body=" + encodeURIComponent(bodyText);
            window.location.href = mailtoLink;
        }

        // تحديث قائمة الشرف (Leaderboard)
        function updateHonorBoard() {
            database.ref('attacks').on('value', (snapshot) => {
                const honorGrid = document.getElementById('honorGrid');
                if (!honorGrid) return;
                let userStats = {};
                snapshot.forEach((child) => {
                    const data = child.val();
                    if (data.user) userStats[data.user] = (userStats[data.user] || 0) + 1;
                });
                let sortedUsers = Object.keys(userStats).map(name => ({ name: name, count: userStats[name] }))
                    .sort((a, b) => b.count - a.count).slice(0, 10);
                honorGrid.innerHTML = '';
                sortedUsers.forEach((user, index) => {
                    let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "⚔️";
                    honorGrid.innerHTML += `
                        <div class="attack-log" style="border-right: 3px solid var(--gold); display: flex; justify-content: space-between; align-items: center;">
                            <div><span style="color:var(--gold); font-weight:bold;">${medal} ${user.name}</span><div style="font-size:10px; color:#aaa;">رتبة: ${getRank(user.count)}</div></div>
                            <div style="color:var(--fire); font-weight:900; font-size:18px;">${user.count}</div>
                        </div>`;
                });
                if (sortedUsers.length === 0) honorGrid.innerHTML = '<p style="color: #666;"> ⚔️ جاري تحميل ألاساطير ..</p>';
            });
        }

        // تبديل الصفحات
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById('btn-' + pageId).classList.add('active');
        }

        async function pasteKlisha() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('msg').value = text;
                localStorage.setItem('msg', text);
                showStatus("✅ تم لصق النص");
            } catch (err) { showStatus("❌ فشل اللصق"); }
        }

        function showStatus(text) { const m = document.getElementById('statusMsg'); m.innerText = text; m.style.display = 'block'; setTimeout(() => m.style.display = 'none', 3000); }

        // تهيئة عند التشغيل
        window.onload = () => {
            updateSmartContent();
            initSparks(); drawSparks();
            updateHonorBoard();
            const myStrikes = parseInt(localStorage.getItem("strike_count") || 0);
            document.getElementById("countDisplay").innerText = myStrikes;
            document.getElementById("userRank").innerText = getRank(myStrikes);
            ['sub', 'msg'].forEach(id => {
                const saved = localStorage.getItem(id);
                if (saved) document.getElementById(id).value = saved;
                document.getElementById(id).oninput = () => localStorage.setItem(id, document.getElementById(id).value);
            });
        };

        function updateSmartContent() {
            const seed = Math.floor(new Date().getMinutes() / 5);
            document.getElementById('onlineUsers').innerText = 13 + (seed * 77 % 50);
            const quotes = ["المواقف الصعبة تبني الأشخاص الأقوياء.", "الجاهل يعرف بكلامه، والحكيم يُعرف بصمته.", "في وقت الشدة تعرف من هم أحبابك.."];
            document.getElementById('tickerText').innerText = quotes[seed % quotes.length];
        }
        setInterval(updateSmartContent, 10000);

        // تأثير الشرر في الخلفية
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        let sparks = [];
        function initSparks() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; sparks = []; for (let i = 0; i < 40; i++) { sparks.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 + 1, speed: Math.random() * 3 + 1, opacity: Math.random() * 0.5 + 0.2 }); } }
        function drawSparks() { ctx.clearRect(0, 0, canvas.width, canvas.height); sparks.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = `rgba(255, ${Math.random() * 100 + 50}, 0, ${p.opacity})`; ctx.fill(); p.y += p.speed; if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; } }); requestAnimationFrame(drawSparks); }
    </script>
</body>
</html>
