<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAHM ING PRO | @ShahmZone</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* نظام الثيمات المتعددة */
        :root { --neon: #00f2ff; --gold: #ffcc00; --bg: #05060a; --red: #ff4b2b; --card-bg: rgba(10, 12, 18, 0.95); }
        .theme-toxic { --neon: #39ff14; --gold: #ccff00; --bg: #020500; }
        .theme-ember { --neon: #ff3131; --gold: #ff9100; --bg: #050000; }
        .theme-matte { --neon: #555; --gold: #aaa; --bg: #000; --card-bg: rgba(5,5,5,0.98); }
        .theme-deep { --neon: #bc13fe; --gold: #fff; --bg: #0a000f; }

        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; transition: 0.5s; }
        #rainCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        .main-card { 
            background: var(--card-bg); padding: 25px; border-radius: 25px; 
            width: 90%; max-width: 400px; border: 1px solid var(--neon); 
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1); text-align: center; 
            backdrop-filter: blur(10px); position: relative; transition: 0.3s;
        }
        
        .pulse-hit { animation: pulse 0.4s ease-out; }
        @keyframes pulse { 0% { box-shadow: 0 0 0px var(--red); } 50% { box-shadow: 0 0 50px var(--red); border-color: var(--red); } 100% { box-shadow: 0 0 0px var(--red); } }

        h1 { font-size: 32px; font-weight: 900; margin: 0; color: white; }
        h1 span { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        .sub-title { color: var(--neon); font-size: 9px; letter-spacing: 3px; margin-bottom: 20px; opacity: 0.8; }
        
        .strike-display { background: rgba(0, 242, 255, 0.05); border: 1px dashed var(--neon); padding: 12px; border-radius: 15px; margin-bottom: 15px; }
        .strike-count { font-size: 26px; font-weight: 900; color: var(--gold); }

        .field { text-align: right; margin-bottom: 12px; position: relative; }
        label { display: block; font-size: 11px; color: #8899a6; margin-bottom: 4px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; background: #111821; border: 1px solid #2f3336; border-radius: 10px; color: white; outline: none; box-sizing: border-box; font-family: 'Cairo'; }
        
        .small-btn { background: transparent; color: var(--neon); border: 1px solid var(--neon); padding: 3px 8px; border-radius: 6px; font-size: 9px; cursor: pointer; margin-top: 5px; transition: 0.2s; }
        .copy-btn { position: absolute; left: 8px; top: 30px; background: var(--neon); color: black; border: none; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; cursor: pointer; z-index: 2; }

        .btn-go { background: linear-gradient(45deg, var(--neon), #3a7bd5); color: white; padding: 15px; border: none; border-radius: 15px; cursor: pointer; width: 100%; font-weight: 900; font-size: 18px; margin-top: 10px; box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3); }
        
        #statusMsg { position: fixed; top: 20px; background: var(--gold); color: black; padding: 10px 20px; border-radius: 10px; font-weight: bold; display: none; z-index: 100; animation: slideDown 0.3s; }
        @keyframes slideDown { from { transform: translateY(-50px); } to { transform: translateY(0); } }

        .btn-dev { background: transparent; color: white; border: 1px solid white; padding: 8px; border-radius: 10px; cursor: pointer; width: 100%; margin-top: 15px; font-size: 12px; font-weight: bold; text-decoration: none; display: inline-block; box-sizing: border-box; }
        .rights { margin-top: 20px; font-size: 11px; color: #55acee; }
    </style>
</head>
<body>

    <div id="statusMsg">تم تجهيز الضربة.. اجهز يا ضحية! ⚡</div>
    <canvas id="rainCanvas"></canvas>

    <div class="main-card" id="card">
        <div style="text-align: left;">
            <button class="small-btn" onclick="nextTheme()" id="themeBtn">تبديل الثيم 🎨 (النيون)</button>
        </div>

        <h1>SHAHM <span>ING</span></h1>
        <div class="sub-title">PREMIUM STRIKE SYSTEM</div>

        <div class="strike-display">
            <div style="font-size: 10px; color: #8899a6;">إجمالي الضربات الحالية</div>
            <div class="strike-count" id="countDisplay">0</div>
            <button class="small-btn" style="color:var(--red); border-color:var(--red)" onclick="resetCounter()">تصفير 🔄</button>
        </div>

        <div class="field">
            <label>بريد الدعم</label>
            <input type="email" id="target" placeholder="support@telegram.org">
            <button class="small-btn" onclick="setMail('abuse@telegram.org')">استخدام بريد الإساءة ⚠️</button>
        </div>

        <div class="field">
            <label>الموضوع</label>
            <input type="text" id="sub" placeholder="Report Case">
        </div>

        <div class="field">
            <label>الكليشة</label>
            <button class="copy-btn" onclick="copyKlisha()">نسخ 📋</button>
            <textarea id="msg" rows="4" placeholder="اكتب بلاغك هنا..."></textarea>
        </div>

        <button class="btn-go" onclick="send()">إطلاق الهجوم ⚡</button>
        
        <a href="https://t.me/ShahmZone" class="btn-dev">تواصل مع المطور 👨‍💻</a>

        <div class="rights">
            حقوق النظام محفوظة لـ <span style="color: var(--gold);">SHAHM ZONE</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, raindrops = [], tilt = 0;

        // مصفوفة الثيمات
        const themes = [
            { class: '', name: 'النيون' },
            { class: 'theme-toxic', name: 'الهكر' },
            { class: 'theme-ember', name: 'الجمرة' },
            { class: 'theme-matte', name: 'الملكي' },
            { class: 'theme-deep', name: 'البنفسجي' }
        ];
        let currentThemeIdx = 0;

        function nextTheme() {
            document.body.classList.remove(themes[currentThemeIdx].class);
            currentThemeIdx = (currentThemeIdx + 1) % themes.length;
            if (themes[currentThemeIdx].class) document.body.classList.add(themes[currentThemeIdx].class);
            document.getElementById('themeBtn').innerText = `تبديل الثيم 🎨 (${themes[currentThemeIdx].name})`;
            localStorage.setItem('savedTheme', currentThemeIdx);
        }

        function initRain() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            raindrops = [];
            for (let i = 0; i < 80; i++) raindrops.push({ x: Math.random() * width, y: Math.random() * height, len: Math.random() * 20 + 10, speed: Math.random() * 5 + 3 });
        }

        function drawRain() {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--neon').trim();
            ctx.lineWidth = 1;
            raindrops.forEach(p => {
                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + tilt, p.y + p.len); ctx.stroke();
                p.y += p.speed; p.x += tilt * 0.1;
                if (p.y > height) { p.y = -p.len; p.x = Math.random() * width; }
            });
            requestAnimationFrame(drawRain);
        }

        window.addEventListener('deviceorientation', (e) => { tilt = (e.gamma || 0) * 0.6; });
        window.addEventListener('resize', initRain);

        function setMail(m) { document.getElementById('target').value = m; localStorage.setItem('target', m); }
        
        function copyKlisha() {
            const txt = document.getElementById('msg');
            txt.select();
            document.execCommand('copy');
            showStatus("تم نسخ الكليشة! ✅");
        }

        function showStatus(text) {
            const m = document.getElementById('statusMsg');
            m.innerText = text; m.style.display = 'block';
            setTimeout(() => m.style.display = 'none', 2500);
        }

        const ids = ['target', 'sub', 'msg'];
        window.onload = () => {
            initRain(); drawRain();
            
            // استرجاع الثيم المفضل
            const saved = localStorage.getItem('savedTheme');
            if (saved !== null) {
                currentThemeIdx = parseInt(saved);
                if (themes[currentThemeIdx].class) document.body.classList.add(themes[currentThemeIdx].class);
                document.getElementById('themeBtn').innerText = `تبديل الثيم 🎨 (${themes[currentThemeIdx].name})`;
            }

            ids.forEach(id => {
                document.getElementById(id).value = localStorage.getItem(id) || "";
                document.getElementById(id).oninput = () => localStorage.setItem(id, document.getElementById(id).value);
            });
            document.getElementById("countDisplay").innerText = localStorage.getItem("strike_count") || 0;
        };

        function resetCounter() { if(confirm("تصفير العداد؟")) { localStorage.setItem("strike_count", 0); document.getElementById("countDisplay").innerText = 0; } }

        function send() {
            const card = document.getElementById('card');
            card.classList.add('pulse-hit');
            setTimeout(() => card.classList.remove('pulse-hit'), 400);

            let strikes = parseInt(localStorage.getItem("strike_count") || 0) + 1;
            localStorage.setItem("strike_count", strikes);
            document.getElementById("countDisplay").innerText = strikes;

            showStatus("تم تجهيز الضربة.. اجهز يا ضحية! ⚡");

            const t = document.getElementById("target").value || "support@telegram.org";
            const s = document.getElementById("sub").value || "Support";
            const m = document.getElementById("msg").value;

            setTimeout(() => {
                window.location.href = `mailto:${t}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(m)}`;
            }, 800);
        }
    </script>
</body>
</html>
