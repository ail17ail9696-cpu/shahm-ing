<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS SYSTEM | THE DRAGON 🐲</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background: #000 url('https://w0.peakpx.com/wallpaper/188/875/HD-wallpaper-black-stone-wall-texture-black-stone-background-stone-textures-wall-black-backgrounds.jpg');
            background-size: cover; color: white; font-family: 'Cairo', sans-serif; min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.9); border-bottom: 2px solid #8b0000;
            padding: 15px 0; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .header-title { font-size: 28px; font-weight: 900; }
        .header-title span { color: #ff3131; }
        
        nav {
            display: flex; justify-content: center; gap: 10px;
            background: rgba(30, 0, 0, 0.85); padding: 10px;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(5px);
        }
        nav button {
            background: transparent; border: none; color: #888;
            cursor: pointer; font-size: 14px; font-weight: bold; font-family: 'Cairo';
            padding: 8px 12px; transition: 0.3s; border-radius: 5px;
        }
        nav button:hover, nav button.active { color: #ff3131; background: rgba(255,0,0,0.1); }

        .container { max-width: 900px; margin: 30px auto; padding: 0 15px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .glass-box {
            background: rgba(10, 10, 10, 0.95); border: 1px solid #330000;
            border-radius: 15px; padding: 25px; box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        /* حقول الإدخال */
        .field { margin-bottom: 20px; text-align: right; }
        label { display: block; color: #ff3131; font-weight: bold; margin-bottom: 8px; font-size: 13px; }
        input, textarea {
            width: 100%; background: #050505; border: 1px solid #441111;
            border-radius: 8px; padding: 12px; color: #fff; font-family: 'Cairo'; box-sizing: border-box; outline: none;
        }
        input:focus { border-color: #ff3131; }

        .btn-send {
            background: linear-gradient(to bottom, #8b0000, #4a0000); color: white; border: 1px solid #ff3131; 
            padding: 15px; width: 100%; border-radius: 8px; font-weight: 900; font-size: 20px; cursor: pointer;
        }

        /* هجوم السلسلة */
        .attack-log {
            background: rgba(20, 0, 0, 0.4); padding: 15px; border-radius: 10px;
            margin-bottom: 12px; border-right: 4px solid #ff3131;
            display: flex; justify-content: space-between; align-items: center;
            animation: slideRight 0.5s ease;
        }
        @keyframes slideRight { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .log-user { color: #d4af37; font-weight: bold; }
        .log-link { color: #555; font-size: 11px; font-family: monospace; }

        /* قائمة الشرف */
        .honor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .honor-card {
            background: #0f0f0f; border: 1px solid #d4af37; padding: 15px; 
            border-radius: 10px; text-align: center; position: relative;
        }
        .honor-card h4 { margin: 5px 0; color: #eee; }
        .star-count { color: #d4af37; font-size: 12px; font-weight: bold; }

        footer { text-align: center; padding: 30px; color: #444; font-size: 14px; }
    </style>
</head>
<body>

<header>
    <div class="header-title">نظام <span>أوس</span> | AWS SYSTEM</div>
    <div style="font-size: 10px; color: #d4af37; letter-spacing: 5px; font-weight: bold;">FIRE AND BLOOD 🐲</div>
</header>

<nav>
    <button onclick="showPage('home')" id="btn-home" class="active">الرئيسية</button>
    <button onclick="showPage('attacks')" id="btn-attacks">هجوم السلسلة ⛓️</button>
    <button onclick="showPage('honor')" id="btn-honor">قائمة الشرف 🎖️</button>
    <button onclick="window.location.href='https://t.me/Tydj7_'">دعم النجوم ⭐</button>
</nav>

<div class="container">
    
    <!-- الصفحة الرئيسية -->
    <div id="home" class="page active">
        <div class="glass-box">
            <div class="field">
                <label>موضوع الضربة</label>
                <input type="text" id="sub" placeholder="Subject...">
            </div>
            <div class="field">
                <label>الجيميل المستهدف (تلقائي)</label>
                <input type="text" value="abuse@telegram.org" readonly style="opacity: 0.7;">
            </div>
            <div class="field">
                <label>كليشة الهجوم</label>
                <textarea id="msg" rows="5" placeholder="ضع كليشتك هنا..."></textarea>
            </div>
            <div style="margin-bottom: 15px; font-size: 13px;">الضربات المسجلة: <span id="countDisplay" style="color:#ff3131; font-weight:900;">0</span></div>
            <button class="btn-send" onclick="send()">إطلاق الهجوم 🔥</button>
        </div>
    </div>

    <!-- هجوم السلسلة -->
    <div id="attacks" class="page">
        <div class="glass-box">
            <h3 style="color:#ff3131; margin-top:0;">العمليات الحالية ⛓️</h3>
            <p style="font-size:11px; color:#666;">يتم التحديث تلقائياً كل 5 دقائق...</p>
            <div id="attackLogs">
                <!-- يتم توليد المحتوى بواسطة JS -->
            </div>
        </div>
    </div>

    <!-- قائمة الشرف -->
    <div id="honor" class="page">
        <div class="glass-box">
            <h3 style="color:#d4af37; margin-top:0;">أساطير التارغاريان 🎖️</h3>
            <div class="honor-grid">
                <div class="honor-card"><h4>أوس</h4><div class="star-count">20 نجوم 🌟</div></div>
                <div class="honor-card"><h4>حمودي</h4><div class="star-count">15 نجوم 🌟</div></div>
                <div class="honor-card"><h4>F16</h4><div class="star-count">12 نجوم 🌟</div></div>
                <div class="honor-card"><h4>الرعب الأسود</h4><div class="star-count">10 نجوم 🌟</div></div>
                <div class="honor-card"><h4>تيم فاذر</h4><div class="star-count">10 نجوم 🌟</div></div>
                <div class="honor-card"><h4>AWS VIP</h4><div class="star-count">8 نجوم 🌟</div></div>
            </div>
        </div>
    </div>

</div>

<footer>قوة التارغاريان بين يديك..</footer>

<script>
    // نظام تبديل الصفحات
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.getElementById('btn-' + pageId).classList.add('active');
        if(pageId === 'attacks') generateAttacks(); // توليد عند الفتح
    }

    // توليد هجمات وهمية مزخرفة
    const fakeNames = [
        "أوسُ اإلُِحٍٍڪيمُِ", "V_I_P_D_R_A_G_O_N", "حٍمودِي اإلُِحٍٍرٍبي", "F-16_STRIKE", 
        "تيمُِ الُِرٍعٍبَ اإلُِأسوُِدِ", "父 FATHER 父", "DARK_AWS", "الُِمُِهـيَبَ", 
        "GHOST_STRIKE", "سيفُُ اإلُِإسلُِامُِ", "Gamer_Boy", "K-I-N-G-O-F-AWS"
    ];

    function generateAttacks() {
        const container = document.getElementById('attackLogs');
        container.innerHTML = ''; // تنظيف القديم
        
        // توليد 6 هجمات عشوائية
        for(let i=0; i<6; i++) {
            const name = fakeNames[Math.floor(Math.random() * fakeNames.length)];
            const randomID = Math.floor(Math.random() * 999999);
            const log = document.createElement('div');
            log.className = 'attack-log';
            log.innerHTML = `
                <span class="log-user">👤 ${name}</span>
                <span class="log-link">t.me/joinchat/AWS_${randomID}</span>
            `;
            container.appendChild(log);
        }
    }

    // تحديث الهجمات كل 5 دقائق
    setInterval(generateAttacks, 300000);

    // وظيفة الإرسال والعداد
    window.onload = () => {
        document.getElementById("countDisplay").innerText = localStorage.getItem("strike_count") || 0;
        generateAttacks();
    };

    function send() {
        let count = parseInt(localStorage.getItem("strike_count") || 0) + 1;
        localStorage.setItem("strike_count", count);
        document.getElementById("countDisplay").innerText = count;

        const sub = document.getElementById("sub").value;
        const msg = document.getElementById("msg").value;
        const mailto = `mailto:abuse@telegram.org?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(msg)}`;
        
        window.location.href = mailto;
    }
</script>

</body>
</html>
