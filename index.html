<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AWS SYSTEM | THE FINAL DRAGON 🐲</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --fire: #ff3131; --gold: #d4af37; --bg: #0a0a0a; 
            --card-bg: rgba(15, 15, 15, 0.98); --dragon-glow: rgba(255, 49, 49, 0.3);
        }
        body { 
            background: var(--bg); color: white; font-family: 'Cairo', sans-serif; 
            margin: 0; display: flex; align-items: flex-start; justify-content: center; 
            min-height: 100vh; padding: 15px; box-sizing: border-box;
            background-image: radial-gradient(circle at center, #1a0505 0%, #0a0a0a 100%);
        }
        #rainCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .main-card { 
            background: var(--card-bg); padding: 25px; border-radius: 20px; 
            width: 100%; max-width: 450px; border: 2px solid #2a0000;
            box-shadow: 0 0 40px var(--dragon-glow); text-align: center; backdrop-filter: blur(15px); 
            position: relative; border-top: 4px solid var(--fire); margin-top: 10px;
        }
        h1 { font-size: 30px; font-weight: 900; margin: 0; color: white; }
        h1 span { color: var(--fire); text-shadow: 0 0 15px var(--fire); }
        .sub-title { color: var(--gold); font-size: 10px; letter-spacing: 3px; margin-bottom: 20px; font-weight: bold; }
        .strike-display { background: rgba(255, 0, 0, 0.08); border: 1px solid #441111; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        .strike-count { font-size: 35px; font-weight: 900; color: var(--gold); }
        .field { text-align: right; margin-bottom: 18px; position: relative; }
        label { display: block; font-size: 13px; color: #b0b0b0; margin-bottom: 8px; font-weight: bold; }
        input, textarea { 
            width: 100%; padding: 16px; background: #1a0f0f; border: 1px solid #3d1a1a; 
            border-radius: 12px; color: white; outline: none; box-sizing: border-box; 
            font-size: 16px; font-family: 'Cairo'; transition: 0.3s;
        }
        .paste-btn { position: absolute; left: 10px; top: 38px; background: var(--gold); color: black; border: none; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; z-index: 5; cursor: pointer; }
        .btn-go { background: linear-gradient(45deg, #8b0000, #ff3131); color: white; padding: 20px; border: none; border-radius: 15px; cursor: pointer; width: 100%; font-weight: 900; font-size: 24px; margin-top: 10px; box-shadow: 0 8px 20px rgba(255, 0, 0, 0.4); }
        #statusMsg { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--fire); color: white; padding: 15px 30px; border-radius: 50px; font-weight: bold; display: none; z-index: 9999; box-shadow: 0 0 25px var(--fire); width: 90%; text-align: center; font-size: 14px; }
        .btn-dev { background: rgba(212, 175, 55, 0.05); color: var(--gold); border: 1px solid var(--gold); padding: 15px; border-radius: 12px; width: 100%; margin-top: 25px; font-size: 15px; text-decoration: none; display: inline-block; box-sizing: border-box; text-align: center; font-weight: bold; }
        .rights { margin-top: 30px; font-size: 13px; color: #777; }
        .tg-note { font-size: 11px; color: #888; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>
    <div id="statusMsg">🔥 دراكاريس! جاري الإرسال</div>
    <canvas id="rainCanvas"></canvas>
    <div class="main-card">
        <h1>AWS <span>SYSTEM</span></h1>
        <div class="sub-title">DRACARYS PROTOCOL 🐲</div>
        
        <div class="strike-display">
            <div style="font-size: 12px; color: #a0a0a0;">إجمالي ضربات التنين</div>
            <div class="strike-count" id="countDisplay">0</div>
            <button onclick="resetCounter()" style="background:transparent; border:none; color:#555; cursor:pointer; font-size:11px;">تصفير 🔄</button>
        </div>

        <div class="field">
            <label>هدف الهجوم (تعبئة تلقائية)</label>
            <input type="text" id="target" value="abuse@telegram.org" readonly style="color: var(--gold); border-color: var(--gold); text-align: center; font-weight: bold;">
        </div>

        <div class="field">
            <label>موضوع الضربة</label>
            <input type="text" id="sub" placeholder="اكتب الموضوع هنا...">
        </div>

        <div class="field">
            <label>كليشة الهجوم</label>
            <button class="paste-btn" onclick="pasteKlisha()">لصق 📋</button>
            <textarea id="msg" rows="5" placeholder="الصق كليشتك هنا..."></textarea>
        </div>

        <button class="btn-go" onclick="send()">دراكاريس 🔥</button>
        
        <p class="tg-note">* إذا لم يظهر البريد داخل تليجرام، افتح الرابط في المتصفح الخارجي.</p>

        <a href="https://t.me/Tydj7" class="btn-dev">تواصل مع القائد أوس 🐲</a>
        <div class="rights">
            <span style="color: var(--gold); display: block;">"النار والدم.. القوة بين يديك"</span>
            حقوق النظام محفوظة لـ <span style="color: var(--fire);">AWS V30</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        let sparks = [];
        function initSparks() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; sparks = []; for (let i = 0; i < 40; i++) { sparks.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 + 1, speed: Math.random() * 3 + 1, opacity: Math.random() * 0.5 + 0.2 }); } }
        function drawSparks() { ctx.clearRect(0, 0, canvas.width, canvas.height); sparks.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = `rgba(255, ${Math.random() * 100 + 50}, 0, ${p.opacity})`; ctx.fill(); p.y += p.speed; if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; } }); requestAnimationFrame(drawSparks); }
        
        async function pasteKlisha() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('msg').value = text;
                localStorage.setItem('msg', text);
                showStatus("✅ تم لصق النص");
            } catch (err) { showStatus("❌ يرجى منح إذن الحافظة"); }
        }

        function showStatus(text) { const m = document.getElementById('statusMsg'); m.innerText = text; m.style.display = 'block'; setTimeout(() => m.style.display = 'none', 3000); }

        window.onload = () => {
            initSparks(); drawSparks();
            ['sub', 'msg'].forEach(id => {
                const saved = localStorage.getItem(id);
                if (saved) document.getElementById(id).value = saved;
                document.getElementById(id).oninput = () => localStorage.setItem(id, document.getElementById(id).value);
            });
            document.getElementById("countDisplay").innerText = localStorage.getItem("strike_count") || 0;
        };

        function resetCounter() { if(confirm("تصفير السجلات؟")) { localStorage.setItem("strike_count", 0); document.getElementById("countDisplay").innerText = 0; } }

        function send() {
            let strikes = parseInt(localStorage.getItem("strike_count") || 0) + 1;
            localStorage.setItem("strike_count", strikes);
            document.getElementById("countDisplay").innerText = strikes;
            
            const targetMail = "abuse@telegram.org";
            const subjectText = document.getElementById("sub").value.trim();
            const bodyText = document.getElementById("msg").value;

            showStatus("🔥 جاري كسر القيود وتوجيه الضربة..");

            // الحيلة التقنية: تكرار البريد مرتين بصيغ مختلفة لإجبار متصفح تليجرام على الفهم
            const mailtoLink = "mailto:" + targetMail + "?to=" + targetMail + "&subject=" + encodeURIComponent(subjectText) + "&body=" + encodeURIComponent(bodyText);

            // محاولة فتح الرابط في نافذة جديدة لإجبار تليجرام على الخروج للمتصفح الافتراضي
            const newWin = window.open(mailtoLink, '_blank');
            
            // احتياط إذا منع تليجرام النافذة الجديدة
            if(!newWin || newWin.closed || typeof newWin.closed=='undefined') {
                window.location.href = mailtoLink;
            }
        }
    </script>
</body>
</html>
