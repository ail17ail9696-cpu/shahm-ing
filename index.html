<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAHM ING PRO | @ShahmZone</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --gold: #ffcc00; --bg: #05060a; --red: #ff4b2b; --card-bg: rgba(10, 12, 18, 0.95); }
        .incognito { --neon: #555; --gold: #888; --bg: #000; --card-bg: rgba(5, 5, 5, 0.98); }
        
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; transition: 0.5s; }
        #rainCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        .main-card { 
            background: var(--card-bg); padding: 30px; border-radius: 25px; 
            width: 90%; max-width: 400px; border: 1px solid var(--neon); 
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1); text-align: center; 
            backdrop-filter: blur(10px); position: relative; transition: 0.3s;
        }
        
        /* تأثير النبض */
        .pulse-hit { animation: pulse 0.4s ease-out; }
        @keyframes pulse { 0% { box-shadow: 0 0 0px var(--red); } 50% { box-shadow: 0 0 50px var(--red); border-color: var(--red); } 100% { box-shadow: 0 0 0px var(--red); } }

        h1 { font-size: 32px; font-weight: 900; margin: 0; }
        h1 span { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        .sub-title { color: var(--neon); font-size: 9px; letter-spacing: 3px; margin-bottom: 20px; opacity: 0.8; }
        
        .strike-display { background: rgba(255, 255, 255, 0.03); border: 1px dashed var(--neon); padding: 12px; border-radius: 15px; margin-bottom: 20px; }
        .strike-count { font-size: 30px; font-weight: 900; color: var(--gold); }

        .field { text-align: right; margin-bottom: 15px; position: relative; }
        label { display: block; font-size: 11px; color: #8899a6; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 12px; background: #0c1117; border: 1px solid #2f3336; border-radius: 12px; color: white; outline: none; box-sizing: border-box; font-family: 'Cairo'; }
        input:focus { border-color: var(--neon); }

        .quick-btns { display: flex; gap: 5px; margin-top: 5px; }
        .small-btn { background: transparent; color: var(--neon); border: 1px solid var(--neon); padding: 3px 8px; border-radius: 6px; font-size: 9px; cursor: pointer; }

        .btn-go { background: linear-gradient(45deg, #00d2ff, #3a7bd5); color: white; padding: 18px; border: none; border-radius: 15px; cursor: pointer; width: 100%; font-weight: 900; font-size: 20px; margin-top: 15px; box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3); }
        
        /* رسالة التأكيد */
        #statusMsg { position: fixed; top: 20px; background: var(--gold); color: black; padding: 10px 20px; border-radius: 10px; font-weight: bold; display: none; z-index: 100; animation: slideDown 0.3s; }
        @keyframes slideDown { from { transform: translateY(-50px); } to { transform: translateY(0); } }

        .footer-links { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
        .link-dev { color: white; text-decoration: none; font-size: 12px; border: 1px solid #333; padding: 8px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="statusMsg">تم تجهيز الضربة.. اجهز يا ضحية! ⚡</div>
    <canvas id="rainCanvas"></canvas>

    <div class="main-card" id="card">
        <div style="text-align: left;">
            <button class="small-btn" onclick="toggleIncognito()">وضع التخفي 🕶️</button>
        </div>

        <h1>SHAHM <span>ING</span></h1>
        <div class="sub-title">PREMIUM STRIKE SYSTEM</div>

        <div class="strike-display">
            <div class="strike-count" id="countDisplay">0</div>
            <button class="small-btn" style="color:var(--red); border-color:var(--red)" onclick="resetCounter()">تصفير 🔄</button>
        </div>

        <div class="field">
            <label>بريد البلاغ</label>
            <input type="email" id="target" placeholder="support@telegram.org">
            <div class="quick-btns">
                <button class="small-btn" onclick="setMail('abuse@telegram.org')">إساءة ⚠️</button>
                <button class="small-btn" onclick="setMail('spam@telegram.org')">سبام 🚫</button>
            </div>
        </div>

        <div class="field">
            <label>الموضوع</label>
            <input type="text" id="sub" placeholder="Case Report">
        </div>

        <div class="field">
            <label>الكليشة</label>
            <button class="small-btn" style="position:absolute; left:5px; top:28px" onclick="copyKlisha()">نسخ 📋</button>
            <textarea id="msg" rows="4" placeholder="اكتب بلاغك هنا..."></textarea>
        </div>

        <button class="btn-go" onclick="send()">إطلاق الهجوم ⚡</button>
        
        <div class="footer-links">
            <a href="https://t.me/ShahmZone" class="link-dev">المطور: @ShahmZone 👨‍💻</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, raindrops = [], tilt = 0;

        function initRain() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            raindrops = [];
            for (let i = 0; i < 70; i++) raindrops.push({ x: Math.random() * width, y: Math.random() * height, len: Math.random() * 20 + 10, speed: Math.random() * 5 + 3 });
        }

        function drawRain() {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = document.body.classList.contains('incognito') ? '#333' : '#00f2ff';
            ctx.lineWidth = 1;
            raindrops.forEach(p => {
                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + tilt, p.y + p.len); ctx.stroke();
                p.y += p.speed; p.x += tilt * 0.1;
                if (p.y > height) { p.y = -p.len; p.x = Math.random() * width; }
            });
            requestAnimationFrame(drawRain);
        }

        window.addEventListener('deviceorientation', (e) => { tilt = e.gamma * 0.6; });
        window.addEventListener('resize', initRain);

        function toggleIncognito() { document.body.classList.toggle('incognito'); }
        function setMail(m) { document.getElementById('target').value = m; save(); }
        
        function copyKlisha() {
            document.getElementById('msg').select();
            document.execCommand('copy');
            showStatus("تم نسخ الكليشة! ✅");
        }

        function showStatus(text) {
            const m = document.getElementById('statusMsg');
            m.innerText = text; m.style.display = 'block';
            setTimeout(() => m.style.display = 'none', 2500);
        }

        function resetCounter() { if(confirm("تصفير؟")) { localStorage.setItem("strike_count", 0); document.getElementById("countDisplay").innerText = 0; } }

        const flds = ['target', 'sub', 'msg'];
        window.onload = () => {
            initRain(); drawRain();
            flds.forEach(id => {
                document.getElementById(id).value = localStorage.getItem(id) || "";
                document.getElementById(id).oninput = save;
            });
            document.getElementById("countDisplay").innerText = localStorage.getItem("strike_count") || 0;
        };

        function save() { flds.forEach(id => localStorage.setItem(id, document.getElementById(id).value)); }

        function send() {
            const card = document.getElementById('card');
            card.classList.add('pulse-hit');
            setTimeout(() => card.classList.remove('pulse-hit'), 400);

            let c = parseInt(localStorage.getItem("strike_count") || 0) + 1;
            localStorage.setItem("strike_count", c);
            document.getElementById("countDisplay").innerText = c;

            showStatus("تم تجهيز الضربة.. اجهز يا ضحية! ⚡");
            
            const mail = document.getElementById('target').value || "support@telegram.org";
            const subject = document.getElementById('sub').value;
            const body = document.getElementById('msg').value;
            
            setTimeout(() => {
                window.location.href = `mailto:${mail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            }, 1000);
        }
    </script>
</body>
</html>
