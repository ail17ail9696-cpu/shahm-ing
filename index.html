<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS SYSTEM | FIRE AND BLOOD 🐲</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background: #000 url('https://w0.peakpx.com/wallpaper/188/875/HD-wallpaper-black-stone-wall-texture-black-stone-background-stone-textures-wall-black-backgrounds.jpg');
            background-size: cover; color: white; font-family: 'Cairo', sans-serif; min-height: 100vh;
        }

        header {
            background: rgba(0, 0, 0, 0.95); border-bottom: 2px solid #8b0000;
            padding: 15px 0; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        .header-title { font-size: 28px; font-weight: 900; letter-spacing: 1px; }
        .header-title span { color: #ff3131; text-shadow: 0 0 10px #ff3131; }
        
        nav {
            display: flex; justify-content: center; gap: 8px;
            background: rgba(20, 0, 0, 0.9); padding: 12px;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
            border-bottom: 1px solid #440000;
        }
        nav button {
            background: rgba(255, 255, 255, 0.05); border: 1px solid transparent; color: #ccc;
            cursor: pointer; font-size: 13px; font-weight: bold; font-family: 'Cairo';
            padding: 8px 15px; transition: 0.3s; border-radius: 5px;
        }
        nav button:hover, nav button.active { color: #ff3131; background: rgba(139, 0, 0, 0.2); border-color: #ff3131; }

        .container { max-width: 900px; margin: 30px auto; padding: 0 15px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .glass-box {
            background: rgba(10, 10, 10, 0.98); border: 1px solid #330000;
            border-radius: 15px; padding: 25px; box-shadow: 0 10px 40px rgba(0, 0, 0, 1);
        }

        /* حقول الإدخال */
        .field { margin-bottom: 20px; text-align: right; }
        label { display: block; color: #ff3131; font-weight: bold; margin-bottom: 8px; font-size: 13px; }
        input, textarea {
            width: 100%; background: #070707; border: 1px solid #441111;
            border-radius: 8px; padding: 14px; color: #fff; font-family: 'Cairo'; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: #ff3131; box-shadow: 0 0 10px rgba(255, 49, 49, 0.1); }

        .btn-send {
            background: linear-gradient(180deg, #8b0000 0%, #4a0000 100%); color: white; border: 1px solid #ff3131; 
            padding: 16px; width: 100%; border-radius: 10px; font-weight: 900; font-size: 20px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(139, 0, 0, 0.4); transition: 0.3s;
        }
        .btn-send:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 49, 49, 0.5); }

        /* هجوم السلسلة - بدون روابط */
        .attack-log {
            background: rgba(30, 0, 0, 0.3); padding: 15px; border-radius: 10px;
            margin-bottom: 10px; border-right: 4px solid #ff3131;
            display: flex; flex-direction: column; gap: 5px;
            animation: slideIn 0.4s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        .log-user { color: #d4af37; font-weight: 900; font-size: 15px; }
        .log-target { color: #fff; font-size: 13px; opacity: 0.8; }

        /* قائمة الشرف */
        .honor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .honor-card {
            background: linear-gradient(145deg, #0f0f0f, #050505); border: 1px solid #440000; padding: 20px; 
            border-radius: 12px; text-align: center; border-bottom: 3px solid #d4af37;
        }
        .honor-card h4 { margin: 0 0 10px 0; font-size: 18px; color: #fff; }
        .star-count { color: #d4af37; font-size: 14px; font-weight: bold; background: rgba(212, 175, 55, 0.1); padding: 5px 10px; border-radius: 20px; display: inline-block; }

        footer { text-align: center; padding: 40px; color: #444; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="header-title">نظام <span>أوس</span> | AWS SYSTEM</div>
    <div style="font-size: 10px; color: #d4af37; letter-spacing: 5px; font-weight: bold;">FIRE AND BLOOD 🐲</div>
</header>

<nav>
    <button onclick="showPage('home')" id="btn-home" class="active">الرئيسية 🏠</button>
    <button onclick="showPage('attacks')" id="btn-attacks">هجوم السلسلة ⛓️</button>
    <button onclick="showPage('honor')" id="btn-honor">قائمة الشرف 🎖️</button>
    <button onclick="window.location.href='https://t.me/Tydj7_'">دعم النجوم ⭐</button>
</nav>

<div class="container">
    
    <div id="home" class="page active">
        <div class="glass-box">
            <div class="field">
                <label>موضوع الضربة</label>
                <input type="text" id="sub" placeholder="Enter Subject...">
            </div>
            <div class="field">
                <label>الجهة المستهدفة</label>
                <input type="text" value="abuse@telegram.org" readonly style="opacity: 0.6; color: #d4af37;">
            </div>
            <div class="field">
                <label>كليشة الهجوم</label>
                <textarea id="msg" rows="6" placeholder="الصق الكليشة هنا..."></textarea>
            </div>
            <div style="margin-bottom: 20px; font-size: 14px; font-weight: bold;">الضربات الناجحة: <span id="countDisplay" style="color:#ff3131;">0</span></div>
            <button class="btn-send" onclick="send()">إطلاق دراكاريس 🔥</button>
        </div>
    </div>

    <div id="attacks" class="page">
        <div class="glass-box">
            <h3 style="color:#ff3131; margin:0 0 15px 0;">سجل العمليات المباشر ⛓️</h3>
            <div id="attackLogs">
                </div>
        </div>
    </div>

    <div id="honor" class="page">
        <div class="glass-box">
            <h3 style="color:#d4af37; margin:0 0 20px 0; text-align: center;">أساطير التارغاريان 🎖️</h3>
            <div class="honor-grid">
                <div class="honor-card"><h4>أوس 👑</h4><div class="star-count">15 نجمة 🌟</div></div>
                <div class="honor-card"><h4>دانتي 🔥</h4><div class="star-count">12 نجمة 🌟</div></div>
                <div class="honor-card"><h4>الرعب الاسود 💀</h4><div class="star-count">12 نجمة 🌟</div></div>
                <div class="honor-card"><h4>F16 ✈️</h4><div class="star-count">10 نجمة 🌟</div></div>
                <div class="honor-card"><h4>زويرجات 🛡️</h4><div class="star-count">5 نجوم 🌟</div></div>
            </div>
        </div>
    </div>

</div>

<footer>قوة التارغاريان بين يديك..</footer>

<script>
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.getElementById('btn-' + pageId).classList.add('active');
        if(pageId === 'attacks') generateAttackLogs();
    }

    const dragonUsers = [
        "أوسُ اإلُِحٍٍڪيمُِ", "دانتيُ الُِمُِدِمرٍ", "الُِرٍعٍبَ اإلُِأسوُِدِ", "F-16_STRIKE", "زوُِيرٍجٍات",
        "父 FATHER 父", "DARK_AWS", "الُِمُِهـيَبَ", "GHOST_STRIKE", "سيفُُ اإلُِإسلُِامُِ", "V_I_P_O_S",
        "الُِأسدِ اإلُِعٍرٍاقٌي", "K-I-N-G", "D_R_A_G_O_N", "مُِستحٍيلُِ", "A_W_S_B_O_Y"
    ];

    const targetGroups = [
        "الملوك 👑", "تجمع الابطال", "ساحة الحرب", "عالم وينترفيلد", "ملوك التليجرام", 
        "كتيبة الموت", "نظام الرعب", "تحالف التارغاريان", "قصر النار", "عرش التنين"
    ];

    function generateAttackLogs() {
        const container = document.getElementById('attackLogs');
        container.innerHTML = '';
        
        // توليد 10 هجمات وهمية متنوعة
        for(let i=0; i<10; i++) {
            const user = dragonUsers[Math.floor(Math.random() * dragonUsers.length)];
            const group = targetGroups[Math.floor(Math.random() * targetGroups.length)];
            const log = document.createElement('div');
            log.className = 'attack-log';
            log.innerHTML = `
                <span class="log-user">👤 المهاجم: ${user}</span>
                <span class="log-target">🎯 الهدف: تم سحق [ ${group} ] بنجاح</span>
            `;
            container.appendChild(log);
        }
    }

    setInterval(generateAttackLogs, 300000); // تحديث كل 5 دقائق

    window.onload = () => {
        document.getElementById("countDisplay").innerText = localStorage.getItem("strike_count") || 0;
        generateAttackLogs();
    };

    function send() {
        let count = parseInt(localStorage.getItem("strike_count") || 0) + 1;
        localStorage.setItem("strike_count", count);
        document.getElementById("countDisplay").innerText = count;

        const sub = document.getElementById("sub").value;
        const msg = document.getElementById("msg").value;
        const mailto = `mailto:abuse@telegram.org?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(msg)}`;
        window.location.href = mailto;
    }
</script>

</body>
</html>
