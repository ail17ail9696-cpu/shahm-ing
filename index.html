<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAHM ING PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --gold: #ffcc00; --bg: #05060a; }
        body { 
            background: var(--bg); color: white; font-family: 'Cairo', sans-serif;
            margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .main-card { 
            background: rgba(15, 20, 30, 0.9); padding: 30px; border-radius: 20px; 
            width: 90%; max-width: 400px; border: 1px solid var(--neon);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.15); text-align: center;
        }
        h1 { font-size: 35px; font-weight: 900; margin: 0; color: white; }
        h1 span { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        .sub-title { color: var(--neon); font-size: 10px; letter-spacing: 3px; margin-bottom: 25px; opacity: 0.8; }
        .field { text-align: right; margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #8899a6; margin-bottom: 5px; margin-right: 5px; }
        input, textarea { 
            width: 100%; padding: 12px; background: #111821; border: 1px solid #2f3336;
            border-radius: 10px; color: white; outline: none; box-sizing: border-box; font-family: 'Cairo';
        }
        input:focus { border-color: var(--neon); }
        .btn-go { 
            background: linear-gradient(45deg, #00d2ff, #3a7bd5); color: white;
            padding: 15px; border: none; border-radius: 12px; cursor: pointer;
            width: 100%; font-weight: bold; font-size: 18px; margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }
        .counter-section { margin-top: 20px; padding-top: 15px; border-top: 1px solid #1a242f; font-size: 11px; color: #55acee; }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>SHAHM <span>ING</span></h1>
        <div class="sub-title">PREMIUM STRIKE SYSTEM</div>

        <div class="field">
            <label>بريد الدعم (Target)</label>
            <input type="email" id="target" placeholder="support@telegram.org" oninput="save()">
        </div>

        <div class="field">
            <label>الموضوع</label>
            <input type="text" id="sub" placeholder="Report ID: 772" oninput="save()">
        </div>

        <div class="field">
            <label>الكليشة</label>
            <textarea id="msg" rows="5" placeholder="اكتب بلاغك هنا..." oninput="save()"></textarea>
        </div>

        <button class="btn-go" onclick="send()">إطلاق الهجوم ⚡</button>

        <div class="counter-section">
            <p>إحصائيات الزوار</p>
            <img src="https://hitwebcounter.com/counter/counter.php?page=shahm_v3&style=0006&nbdigits=5&type=page&initCount=0" border="0" />
        </div>
    </div>

    <script>
        window.onload = () => {
            document.getElementById("target").value = localStorage.getItem("t") || "";
            document.getElementById("sub").value = localStorage.getItem("s") || "";
            document.getElementById("msg").value = localStorage.getItem("m") || "";
        };
        function save() {
            localStorage.setItem("t", document.getElementById("target").value);
            localStorage.setItem("s", document.getElementById("sub").value);
            localStorage.setItem("m", document.getElementById("msg").value);
        }
        function send() {
            const t = document.getElementById("target").value || "support@telegram.org";
            const s = document.getElementById("sub").value || "Support";
            const m = document.getElementById("msg").value;
            window.location.href = `mailto:${t}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(m)}`;
        }
    </script>
</body>
</html>
